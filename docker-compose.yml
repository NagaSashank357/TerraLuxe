version: '3.8'

services:
  # ============================================================================
  # MongoDB Database Service
  # ============================================================================
  mongo:
    image: mongo:7-jammy
    container_name: terraluxe-mongo
    restart: always
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - terraluxe-network

  # ============================================================================
  # Java / Spring Boot Backend (Spring Data MongoDB)
  # ============================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: terraluxe-backend
    restart: always
    depends_on:
      - mongo
    environment:
      PORT: ${BACKEND_PORT:-8080}
      MONGO_URI: mongodb://mongo:27017/terraluxe_travel_db
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    networks:
      - terraluxe-network

  # ============================================================================
  # React Front-end Service (Nginx)
  # ============================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:${BACKEND_PORT:-8080}/api/v1
    container_name: terraluxe-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    networks:
      - terraluxe-network

volumes:
  mongo_data:
    driver: local

networks:
  terraluxe-network:
    driver: bridge
